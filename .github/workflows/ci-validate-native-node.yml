name: Validate experimental native Node host

on:
  workflow_dispatch:
  pull_request:
    branches: [main, "releases/*", "features/*"]
    paths:
      - "crates/microsoft-fast-build/**"
      - "crates/microsoft-fast-build-node/**"
      - "packages/fast-build/**"
      - "package-lock.json"
      - ".github/workflows/ci-validate-native-node.yml"
  push:
    branches: [main]
    paths:
      - "crates/microsoft-fast-build/**"
      - "crates/microsoft-fast-build-node/**"
      - "packages/fast-build/**"
      - "package-lock.json"
      - ".github/workflows/ci-validate-native-node.yml"

jobs:
  native:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: npm ci
      - run: cargo install wasm-pack --locked
      - run: npm run build -w @microsoft/fast-build
      - run: cargo fmt --manifest-path crates/microsoft-fast-build-node/Cargo.toml -- --check
      - run: npm run test:native -w @microsoft/fast-build
