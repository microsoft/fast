name: Validate Rust crates

on:
  workflow_dispatch:
  push:
    branches:
    - main
    - releases/*
  pull_request:
    branches:
    - main
    - releases/*
    - features/*
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review

jobs:
  test_rust:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          fetch-depth: 0

    - name: Install Rust stable toolchain
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

    - name: Run Rust microsoft-fast-build tests
      run: cargo test --manifest-path crates/microsoft-fast-build/Cargo.toml

    - name: Run Rust microsoft-fast-build tests
      run: cargo test --manifest-path crates/microsoft-fast-convert/Cargo.toml
