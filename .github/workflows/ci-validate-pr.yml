name: Validate PRs on Chromium

on:
  workflow_dispatch:
  push:
    branches:
    - main
    - releases/*
  pull_request:
    branches:
    - main
    - releases/*
    - features/*
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review

jobs:
  test_js:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: 0

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 22

    - name: Cache multiple paths
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      env:
        cache-name: cache-node-modules
      with:
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-build-
          ${{ runner.os }}-

    - name: Install package dependencies
      run: npm ci

    - name: Check for the presence of changed files inside ./change
      run: npm run checkchange -- ${{ github.event_name == 'pull_request' && format('--branch origin/{0}', github.event.pull_request.base.ref) || '' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Biome CI check
      run: npm run biome:ci

    - name: Install wasm-pack
      run: cargo install wasm-pack

    - name: Build workspaces
      run: npx lage build ${{ github.event_name == 'pull_request' && format('--since origin/{0}', github.event.pull_request.base.ref) || '' }} --allow-no-target-runs --verbose

    - name: Install playwright dependencies and browsers
      run: |
        npx playwright install --with-deps

    - name: Testing unit tests
      run: npx lage test:node test:chromium ${{ github.event_name == 'pull_request' && format('--since origin/{0}', github.event.pull_request.base.ref) || '' }} --allow-no-target-runs --verbose --concurrency 1

    - name: End-to-end tests for example apps
      run: npm run test:e2e

    - name: Testing final validation
      run: npm run test:validation
