# Register this YAML in Azure DevOps with the exact pipeline definition name
# "FAST - CD".
trigger: none
pr: none

parameters:
- name: validationMode
  displayName: Validate release artifacts without external publication
  type: string
  default: 'false'
  values:
  - 'false'
  - 'true'

resources:
  pipelines:
  - pipeline: releaseBuild
    source: FAST - CD Build
    # Manual Run Pipeline selection may intentionally override this default.
    branch: refs/heads/main
    trigger:
      branches:
        include:
        - main
      # Only a stage literally named `BuildArtifacts` fires this trigger, and
      # only when that stage actually completes (a skipped stage — e.g. a
      # `FAST - CD Build` run with nothing pending — never fires it either).
      # `azure-pipelines-build.yml`'s `validationMode: true` path runs under
      # the separate `ValidateArtifacts` stage name specifically so those
      # validation-only runs can never reach this trigger and pull a real
      # `FAST - CD` run into an unwanted (and confusingly red) execution. See
      # the comment above that stage in `azure-pipelines-build.yml` for the
      # full rationale.
      stages:
      - BuildArtifacts
  repositories:
  - repository: fastPipelines
    type: git
    name: open-source/FASTPipelineTemplates
    ref: main
  - repository: 1esPipelines
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  # The pipeline extends the 1ES PT, which injects SDL and compliance tasks.
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    pool:
      name: OneESPool
      image: HostedPoolLinuxImage
      os: linux
    sdl:
      sourceAnalysisPool:
        name: OneESPool
        image: HostedPoolWindowsImage
        os: windows
    settings:
      networkIsolationPolicy: Permissive
    stages:
    - stage: PrepareRelease
      displayName: Validate release artifacts
      jobs:
      - job: Validate
        displayName: Validate release artifacts
        steps:
        - checkout: self
          clean: true

        - download: releaseBuild
          artifact: release-metadata
          displayName: Download release metadata

        - task: UseNode@1
          displayName: Install Node.js
          inputs:
            version: "22.x"

        - task: Bash@3
          name: release
          displayName: Read release metadata
          inputs:
            targetType: inline
            # FAST has no single workspace-wide release version, so the
            # manifest (rather than a single `release-version.txt`) is the
            # source of truth for which packages are pending. This emits
            # one `<prefix>NeedsRelease` / `<prefix>ReleaseTag` /
            # `<prefix>ReleaseVersion` output per currently-publishable
            # workspace, plus a shared `releaseCommit`.
            script: |
              set -euo pipefail
              metadata_dir="${METADATA_INPUT_DIR:?METADATA_INPUT_DIR is required}"
              validation_mode=$(<"$metadata_dir/validation-mode.txt")

              if [[ "$validation_mode" != "$EXPECTED_VALIDATION_MODE" ]]; then
                echo "##vso[task.logissue type=error]Release metadata validation mode does not match this pipeline's validationMode parameter."
                exit 1
              fi

              node build/scripts/read-release-manifest.mjs "$metadata_dir/release-manifest.json"
          env:
            METADATA_INPUT_DIR: $(Pipeline.Workspace)/releaseBuild/release-metadata
            EXPECTED_VALIDATION_MODE: ${{ parameters.validationMode }}

        - download: releaseBuild
          artifact: npm_packages
          displayName: Download npm packages

        - download: releaseBuild
          artifact: crate_packages
          displayName: Download crate packages

    - ${{ if eq(parameters.validationMode, 'false') }}:
      # Create every package tag before external publication. A failed
      # registry publish therefore requires maintainers to delete the
      # affected tag before rebuilding/retrying that version.
      - stage: TagRelease
        displayName: Tag releases
        dependsOn: PrepareRelease
        variables:
          releaseCommit: $[ stageDependencies.PrepareRelease.Validate.outputs['release.releaseCommit'] ]
          fastBuildNeedsRelease: $[ stageDependencies.PrepareRelease.Validate.outputs['release.fastBuildNeedsRelease'] ]
          fastBuildReleaseTag: $[ stageDependencies.PrepareRelease.Validate.outputs['release.fastBuildReleaseTag'] ]
          fastElementNeedsRelease: $[ stageDependencies.PrepareRelease.Validate.outputs['release.fastElementNeedsRelease'] ]
          fastElementReleaseTag: $[ stageDependencies.PrepareRelease.Validate.outputs['release.fastElementReleaseTag'] ]
          fastRouterNeedsRelease: $[ stageDependencies.PrepareRelease.Validate.outputs['release.fastRouterNeedsRelease'] ]
          fastRouterReleaseTag: $[ stageDependencies.PrepareRelease.Validate.outputs['release.fastRouterReleaseTag'] ]
          fastTestHarnessNeedsRelease: $[ stageDependencies.PrepareRelease.Validate.outputs['release.fastTestHarnessNeedsRelease'] ]
          fastTestHarnessReleaseTag: $[ stageDependencies.PrepareRelease.Validate.outputs['release.fastTestHarnessReleaseTag'] ]
        jobs:
        - job: Tag
          displayName: Create annotated release tags
          steps:
          - checkout: self
            clean: true
            fetchDepth: 0
            persistCredentials: true

          # Each task is independently idempotent. If another run wins the
          # push race, the task succeeds only when that tag resolves to the
          # validated release commit.
          - task: Bash@3
            displayName: "Tag @microsoft/fast-build release"
            condition: and(succeeded(), eq(variables['fastBuildNeedsRelease'], 'true'))
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                remote_ref="refs/azure-release-tags/${RELEASE_TAG}"
                git fetch --no-tags origin "$RELEASE_COMMIT"
                if git fetch --force origin "refs/tags/${RELEASE_TAG}:${remote_ref}" 2>/dev/null; then
                  existing_commit=$(git rev-parse "${remote_ref}^{}")
                  if [[ "$existing_commit" != "$RELEASE_COMMIT" ]]; then
                    echo "##vso[task.logissue type=error]${RELEASE_TAG} points to ${existing_commit}, not ${RELEASE_COMMIT}."
                    exit 1
                  fi
                  echo "${RELEASE_TAG} already points to ${RELEASE_COMMIT}."
                  exit 0
                fi
                git config user.name "Azure Pipelines"
                git config user.email "azure-pipelines@microsoft.com"
                git tag -a "$RELEASE_TAG" "$RELEASE_COMMIT" -m "Release ${RELEASE_TAG}"
                if git push origin "refs/tags/${RELEASE_TAG}"; then
                  exit 0
                fi
                git fetch --force origin "refs/tags/${RELEASE_TAG}:${remote_ref}"
                raced_commit=$(git rev-parse "${remote_ref}^{}")
                if [[ "$raced_commit" != "$RELEASE_COMMIT" ]]; then
                  echo "##vso[task.logissue type=error]Concurrent tag ${RELEASE_TAG} points to ${raced_commit}, not ${RELEASE_COMMIT}."
                  exit 1
                fi
                echo "Concurrent release run created ${RELEASE_TAG} at the expected commit."
            env:
              RELEASE_TAG: $(fastBuildReleaseTag)
              RELEASE_COMMIT: $(releaseCommit)

          - task: Bash@3
            displayName: "Tag @microsoft/fast-element release"
            condition: and(succeeded(), eq(variables['fastElementNeedsRelease'], 'true'))
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                remote_ref="refs/azure-release-tags/${RELEASE_TAG}"
                git fetch --no-tags origin "$RELEASE_COMMIT"
                if git fetch --force origin "refs/tags/${RELEASE_TAG}:${remote_ref}" 2>/dev/null; then
                  existing_commit=$(git rev-parse "${remote_ref}^{}")
                  if [[ "$existing_commit" != "$RELEASE_COMMIT" ]]; then
                    echo "##vso[task.logissue type=error]${RELEASE_TAG} points to ${existing_commit}, not ${RELEASE_COMMIT}."
                    exit 1
                  fi
                  echo "${RELEASE_TAG} already points to ${RELEASE_COMMIT}."
                  exit 0
                fi
                git config user.name "Azure Pipelines"
                git config user.email "azure-pipelines@microsoft.com"
                git tag -a "$RELEASE_TAG" "$RELEASE_COMMIT" -m "Release ${RELEASE_TAG}"
                if git push origin "refs/tags/${RELEASE_TAG}"; then
                  exit 0
                fi
                git fetch --force origin "refs/tags/${RELEASE_TAG}:${remote_ref}"
                raced_commit=$(git rev-parse "${remote_ref}^{}")
                if [[ "$raced_commit" != "$RELEASE_COMMIT" ]]; then
                  echo "##vso[task.logissue type=error]Concurrent tag ${RELEASE_TAG} points to ${raced_commit}, not ${RELEASE_COMMIT}."
                  exit 1
                fi
                echo "Concurrent release run created ${RELEASE_TAG} at the expected commit."
            env:
              RELEASE_TAG: $(fastElementReleaseTag)
              RELEASE_COMMIT: $(releaseCommit)

          - task: Bash@3
            displayName: "Tag @microsoft/fast-router release"
            condition: and(succeeded(), eq(variables['fastRouterNeedsRelease'], 'true'))
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                remote_ref="refs/azure-release-tags/${RELEASE_TAG}"
                git fetch --no-tags origin "$RELEASE_COMMIT"
                if git fetch --force origin "refs/tags/${RELEASE_TAG}:${remote_ref}" 2>/dev/null; then
                  existing_commit=$(git rev-parse "${remote_ref}^{}")
                  if [[ "$existing_commit" != "$RELEASE_COMMIT" ]]; then
                    echo "##vso[task.logissue type=error]${RELEASE_TAG} points to ${existing_commit}, not ${RELEASE_COMMIT}."
                    exit 1
                  fi
                  echo "${RELEASE_TAG} already points to ${RELEASE_COMMIT}."
                  exit 0
                fi
                git config user.name "Azure Pipelines"
                git config user.email "azure-pipelines@microsoft.com"
                git tag -a "$RELEASE_TAG" "$RELEASE_COMMIT" -m "Release ${RELEASE_TAG}"
                if git push origin "refs/tags/${RELEASE_TAG}"; then
                  exit 0
                fi
                git fetch --force origin "refs/tags/${RELEASE_TAG}:${remote_ref}"
                raced_commit=$(git rev-parse "${remote_ref}^{}")
                if [[ "$raced_commit" != "$RELEASE_COMMIT" ]]; then
                  echo "##vso[task.logissue type=error]Concurrent tag ${RELEASE_TAG} points to ${raced_commit}, not ${RELEASE_COMMIT}."
                  exit 1
                fi
                echo "Concurrent release run created ${RELEASE_TAG} at the expected commit."
            env:
              RELEASE_TAG: $(fastRouterReleaseTag)
              RELEASE_COMMIT: $(releaseCommit)

          - task: Bash@3
            displayName: "Tag @microsoft/fast-test-harness release"
            condition: and(succeeded(), eq(variables['fastTestHarnessNeedsRelease'], 'true'))
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                remote_ref="refs/azure-release-tags/${RELEASE_TAG}"
                git fetch --no-tags origin "$RELEASE_COMMIT"
                if git fetch --force origin "refs/tags/${RELEASE_TAG}:${remote_ref}" 2>/dev/null; then
                  existing_commit=$(git rev-parse "${remote_ref}^{}")
                  if [[ "$existing_commit" != "$RELEASE_COMMIT" ]]; then
                    echo "##vso[task.logissue type=error]${RELEASE_TAG} points to ${existing_commit}, not ${RELEASE_COMMIT}."
                    exit 1
                  fi
                  echo "${RELEASE_TAG} already points to ${RELEASE_COMMIT}."
                  exit 0
                fi
                git config user.name "Azure Pipelines"
                git config user.email "azure-pipelines@microsoft.com"
                git tag -a "$RELEASE_TAG" "$RELEASE_COMMIT" -m "Release ${RELEASE_TAG}"
                if git push origin "refs/tags/${RELEASE_TAG}"; then
                  exit 0
                fi
                git fetch --force origin "refs/tags/${RELEASE_TAG}:${remote_ref}"
                raced_commit=$(git rev-parse "${remote_ref}^{}")
                if [[ "$raced_commit" != "$RELEASE_COMMIT" ]]; then
                  echo "##vso[task.logissue type=error]Concurrent tag ${RELEASE_TAG} points to ${raced_commit}, not ${RELEASE_COMMIT}."
                  exit 1
                fi
                echo "Concurrent release run created ${RELEASE_TAG} at the expected commit."
            env:
              RELEASE_TAG: $(fastTestHarnessReleaseTag)
              RELEASE_COMMIT: $(releaseCommit)

      - stage: PublishRelease
        displayName: Publish npm, crates.io, and GitHub releases
        dependsOn:
        - PrepareRelease
        - TagRelease
        variables:
          releaseCommit: $[ stageDependencies.PrepareRelease.Validate.outputs['release.releaseCommit'] ]
          # When adding a new publishable package, add its package-specific
          # variables here and a matching GitHubRelease@1 task below. See
          # .github/workflows/README.md > Continuous Deployment.
          fastBuildNeedsRelease: $[ stageDependencies.PrepareRelease.Validate.outputs['release.fastBuildNeedsRelease'] ]
          fastBuildReleaseTag: $[ stageDependencies.PrepareRelease.Validate.outputs['release.fastBuildReleaseTag'] ]
          fastBuildReleaseVersion: $[ stageDependencies.PrepareRelease.Validate.outputs['release.fastBuildReleaseVersion'] ]
          fastElementNeedsRelease: $[ stageDependencies.PrepareRelease.Validate.outputs['release.fastElementNeedsRelease'] ]
          fastElementReleaseTag: $[ stageDependencies.PrepareRelease.Validate.outputs['release.fastElementReleaseTag'] ]
          fastElementReleaseVersion: $[ stageDependencies.PrepareRelease.Validate.outputs['release.fastElementReleaseVersion'] ]
          fastRouterNeedsRelease: $[ stageDependencies.PrepareRelease.Validate.outputs['release.fastRouterNeedsRelease'] ]
          fastRouterReleaseTag: $[ stageDependencies.PrepareRelease.Validate.outputs['release.fastRouterReleaseTag'] ]
          fastRouterReleaseVersion: $[ stageDependencies.PrepareRelease.Validate.outputs['release.fastRouterReleaseVersion'] ]
          fastTestHarnessNeedsRelease: $[ stageDependencies.PrepareRelease.Validate.outputs['release.fastTestHarnessNeedsRelease'] ]
          fastTestHarnessReleaseTag: $[ stageDependencies.PrepareRelease.Validate.outputs['release.fastTestHarnessReleaseTag'] ]
          fastTestHarnessReleaseVersion: $[ stageDependencies.PrepareRelease.Validate.outputs['release.fastTestHarnessReleaseVersion'] ]
        jobs:
        - job: Publish
          displayName: Publish npm and crates.io packages
          steps:
          - checkout: self
            clean: true

          - download: releaseBuild
            artifact: npm_packages
            displayName: Download npm packages

          - download: releaseBuild
            artifact: crate_packages
            displayName: Download crate packages

          - task: CopyFiles@2
            displayName: Stage npm packages
            inputs:
              SourceFolder: $(Pipeline.Workspace)/releaseBuild/npm_packages
              Contents: '**'
              TargetFolder: $(Build.SourcesDirectory)/publish_artifacts_npm
              CleanTargetFolder: true

          - task: CopyFiles@2
            displayName: Stage crate packages
            inputs:
              SourceFolder: $(Pipeline.Workspace)/releaseBuild/crate_packages
              Contents: '**'
              TargetFolder: $(Build.SourcesDirectory)/publish_artifacts_crates
              CleanTargetFolder: true

          - task: Bash@3
            displayName: Remove empty artifact directories
            inputs:
              targetType: inline
              # `pack-pending-releases.mjs` writes a `.no-crates-packed`
              # placeholder file into `publish_artifacts_crates` when this
              # release batch has no crate assets, purely so publishing and
              # downloading that (otherwise empty) pipeline artifact along
              # the way is robust. Strip any directory down to nothing here
              # — after the placeholder (and any other non-package file)
              # is discounted — so the release template sees a genuinely
              # *absent* directory for whichever asset type this batch
              # doesn't have, matching its documented "skips absent
              # directories" contract precisely instead of an empty one.
              script: |
                set -euo pipefail
                for dir in "$(Build.SourcesDirectory)/publish_artifacts_npm" "$(Build.SourcesDirectory)/publish_artifacts_crates"; do
                  if [ -d "$dir" ]; then
                    real_file=$(find "$dir" -mindepth 1 -type f ! -name '.no-crates-packed' -print -quit)
                    if [ -z "$real_file" ]; then
                      echo "Removing empty artifact directory: $dir"
                      rm -rf "$dir"
                    fi
                  fi
                done

          - script: |
              printf '\ntag=latest\n' >> .npmrc
            displayName: "Configure npm publish dist-tag"

          # Both npm and crate assets are handed to a single invocation of
          # the release template — rather than two parallel jobs each
          # calling it separately with only one asset type downloaded —
          # so one destination succeeding while the other fails can never
          # leave a package half-published without the whole job failing as
          # one unit. The template skips whichever of
          # `publish_artifacts_npm` / `publish_artifacts_crates` is absent
          # (removed above when empty).
          - template: FAST.Release.PipelineTemplate.yml@fastPipelines

        - job: PublishGitHub
          displayName: Publish GitHub Releases
          dependsOn: Publish
          condition: succeeded()
          steps:
          - checkout: self
            clean: true

          - download: releaseBuild
            artifact: npm_packages
            displayName: Download npm packages

          - download: releaseBuild
            artifact: crate_packages
            displayName: Download crate packages

          - task: CopyFiles@2
            displayName: Stage npm packages
            inputs:
              SourceFolder: $(Pipeline.Workspace)/releaseBuild/npm_packages
              Contents: '**'
              TargetFolder: $(Build.SourcesDirectory)/publish_artifacts_npm
              CleanTargetFolder: true

          - task: CopyFiles@2
            displayName: Stage crate packages
            inputs:
              SourceFolder: $(Pipeline.Workspace)/releaseBuild/crate_packages
              Contents: '**'
              TargetFolder: $(Build.SourcesDirectory)/publish_artifacts_crates
              CleanTargetFolder: true

          - download: releaseBuild
            artifact: release-metadata
            displayName: Download release metadata

          - task: UseNode@1
            displayName: Install Node.js
            inputs:
              version: "22.x"

          - task: Bash@3
            name: releaseCheck
            displayName: Check GitHub releases
            inputs:
              targetType: inline
              # For each package, check whether its GitHub Release already
              # exists on microsoft/fast. This is independent of the
              # NeedsRelease variables computed earlier in PrepareRelease,
              # since those only reflect the state before PublishRelease ran.
              # Each GitHubRelease@1 task's condition can then skip packages
              # whose release already exists, so rerunning PublishGitHub after
              # a partial failure is safe (the rerun will skip already-created
              # releases rather than attempting to recreate them).
              script: |
                set -euo pipefail
                node build/scripts/check-github-releases.mjs "${MANIFEST_PATH}"
            env:
              MANIFEST_PATH: $(Pipeline.Workspace)/releaseBuild/release-metadata/release-manifest.json

          # TagRelease already created and validated these tags. These tasks
          # only create GitHub Releases and attach the packed assets.
          # Each task is conditioned on both NeedsRelease and the absence of
          # an existing GitHub Release, so partial failures can be safely
          # rerun without attempting to recreate releases.
          - task: GitHubRelease@1
            displayName: "Create @microsoft/fast-build GitHub Release"
            condition: and(succeeded(), eq(variables['fastBuildNeedsRelease'], 'true'), eq(variables['releaseCheck.fastBuildGitHubReleaseExists'], 'false'))
            inputs:
              gitHubConnection: fast
              repositoryName: microsoft/fast
              action: create
              target: $(releaseCommit)
              tagSource: userSpecifiedTag
              tag: $(fastBuildReleaseTag)
              title: $(fastBuildReleaseTag)
              releaseNotesSource: inline
              releaseNotesInline: "Automated FAST release for @microsoft/fast-build@$(fastBuildReleaseVersion)."
              addChangeLog: false
              assets: |
                $(Build.SourcesDirectory)/publish_artifacts_npm/microsoft-fast-build-$(fastBuildReleaseVersion).tgz
                $(Build.SourcesDirectory)/publish_artifacts_crates/microsoft-fast-build-$(fastBuildReleaseVersion).crate
                $(Build.SourcesDirectory)/publish_artifacts_crates/microsoft-fast-convert-$(fastBuildReleaseVersion).crate
              assetUploadMode: replace
              isDraft: false
              isPreRelease: false
              makeLatest: legacy

          - task: GitHubRelease@1
            displayName: "Create @microsoft/fast-element GitHub Release"
            condition: and(succeeded(), eq(variables['fastElementNeedsRelease'], 'true'), eq(variables['releaseCheck.fastElementGitHubReleaseExists'], 'false'))
            inputs:
              gitHubConnection: fast
              repositoryName: microsoft/fast
              action: create
              target: $(releaseCommit)
              tagSource: userSpecifiedTag
              tag: $(fastElementReleaseTag)
              title: $(fastElementReleaseTag)
              releaseNotesSource: inline
              releaseNotesInline: "Automated FAST release for @microsoft/fast-element@$(fastElementReleaseVersion)."
              addChangeLog: false
              assets: |
                $(Build.SourcesDirectory)/publish_artifacts_npm/microsoft-fast-element-$(fastElementReleaseVersion).tgz
              assetUploadMode: replace
              isDraft: false
              isPreRelease: false
              makeLatest: legacy

          - task: GitHubRelease@1
            displayName: "Create @microsoft/fast-router GitHub Release"
            condition: and(succeeded(), eq(variables['fastRouterNeedsRelease'], 'true'), eq(variables['releaseCheck.fastRouterGitHubReleaseExists'], 'false'))
            inputs:
              gitHubConnection: fast
              repositoryName: microsoft/fast
              action: create
              target: $(releaseCommit)
              tagSource: userSpecifiedTag
              tag: $(fastRouterReleaseTag)
              title: $(fastRouterReleaseTag)
              releaseNotesSource: inline
              releaseNotesInline: "Automated FAST release for @microsoft/fast-router@$(fastRouterReleaseVersion)."
              addChangeLog: false
              assets: |
                $(Build.SourcesDirectory)/publish_artifacts_npm/microsoft-fast-router-$(fastRouterReleaseVersion).tgz
              assetUploadMode: replace
              isDraft: false
              isPreRelease: false
              makeLatest: legacy

          - task: GitHubRelease@1
            displayName: "Create @microsoft/fast-test-harness GitHub Release"
            condition: and(succeeded(), eq(variables['fastTestHarnessNeedsRelease'], 'true'), eq(variables['releaseCheck.fastTestHarnessGitHubReleaseExists'], 'false'))
            inputs:
              gitHubConnection: fast
              repositoryName: microsoft/fast
              action: create
              target: $(releaseCommit)
              tagSource: userSpecifiedTag
              tag: $(fastTestHarnessReleaseTag)
              title: $(fastTestHarnessReleaseTag)
              releaseNotesSource: inline
              releaseNotesInline: "Automated FAST release for @microsoft/fast-test-harness@$(fastTestHarnessReleaseVersion)."
              addChangeLog: false
              assets: |
                $(Build.SourcesDirectory)/publish_artifacts_npm/microsoft-fast-test-harness-$(fastTestHarnessReleaseVersion).tgz
              assetUploadMode: replace
              isDraft: false
              isPreRelease: false
              makeLatest: legacy
