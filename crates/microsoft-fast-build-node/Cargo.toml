[package]
name = "microsoft-fast-build-node"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Source-built experimental Node-API hosting for FAST native artifacts."

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
microsoft-fast-build = { path = "../microsoft-fast-build" }
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
napi-build = "2"
