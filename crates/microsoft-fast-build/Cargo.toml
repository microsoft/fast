[package]
name = "microsoft-fast-build"
version = "0.23.0"
edition = "2021"
description = "FAST declarative HTML compiler and native artifact renderer for Rust and Node.js."
license = "MIT"
readme = "README.md"
homepage = "https://www.fast.design/"
repository = "https://github.com/microsoft/fast"
keywords = ["fast", "ssr", "html", "template", "web-components"]
categories = ["template-engine", "web-programming"]

[lib]
name = "microsoft_fast_build"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
html5ever = "0.29"
html5gum = { version = "0.8.4", default-features = false, features = ["tree-builder"] }
markup5ever_rcdom = "0.5.0-unofficial"
serde = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }

[features]
node-host = ["dep:napi", "dep:napi-derive", "dep:napi-build", "serde/derive"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
napi = { version = "3", default-features = false, features = ["napi8"], optional = true }
napi-derive = { version = "3", optional = true }

[build-dependencies]
napi-build = { version = "2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
tempfile = "3"
