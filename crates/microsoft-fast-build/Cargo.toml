[package]
name = "microsoft-fast-build"
version = "0.14.0"
edition = "2021"
description = "Server-side renderer for FAST declarative HTML templates — resolves bindings, evaluates conditionals, iterates repeats, and expands custom elements into Declarative Shadow DOM."
license = "MIT"
readme = "README.md"
homepage = "https://www.fast.design/"
repository = "https://github.com/microsoft/fast"
keywords = ["fast", "ssr", "html", "template", "web-components"]
categories = ["template-engine", "web-programming"]

[lib]
name = "microsoft_fast_build"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
allocation-profiling = []

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
allocation-counter = "0.8.1"

[dev-dependencies]
criterion = "0.5"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[[bench]]
name = "render"
harness = false

[[example]]
name = "profile-allocations"
required-features = ["allocation-profiling"]
