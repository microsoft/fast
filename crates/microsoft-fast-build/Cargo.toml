[package]
name = "microsoft-fast-build"
version = "0.18.0"
edition = "2021"
description = "FAST declarative HTML compiler with ahead-of-time JavaScript and native Rust artifact rendering."
license = "MIT"
readme = "README.md"
homepage = "https://www.fast.design/"
repository = "https://github.com/microsoft/fast"
keywords = ["fast", "ssr", "html", "template", "web-components"]
categories = ["template-engine", "web-programming"]

[lib]
name = "microsoft_fast_build"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
html5ever = "0.29"
html5gum = { version = "0.8.4", default-features = false, features = ["tree-builder"] }
markup5ever_rcdom = "0.5.0-unofficial"
serde_json = "1"

[build-dependencies]
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
tempfile = "3"
