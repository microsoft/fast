<f-template name="test-element">
    <template>
        <ul>
            <f-repeat value="{{item in list}}">
                <li>{{item}} - {{item_parent}}</li>
            </f-repeat>
        </ul>
    </template>
</f-template>
<f-template name="test-element-inner-when">
    <template>
        <ul>
            <f-repeat value="{{item in list}}">
                <f-when value="{{item.show}}">
                    <li>{{item.text}}</li>
                </f-when>
            </f-repeat>
        </ul>
    </template>
</f-template>
<f-template name="test-element-with-observer-map">
    <template>
        <ul>
            <f-repeat value="{{item in list}}">
                <li>{{item}} - {{item_parent}}</li>
            </f-repeat>
        </ul>
    </template>
</f-template>
<f-template name="test-element-no-item-repeat-binding">
    <template>
        <ul>
            <f-repeat value="{{item in list}}">
                <li>{{item}}</li>
            </f-repeat>
        </ul>
    </template>
</f-template>
<f-template name="test-element-event">
    <template>
        <f-repeat value="{{item in list}}">
            <button type="button" @click="{handleClick()}">Click</button>
        </f-repeat>
    </template>
</f-template>
<f-template name="test-element-empty-array">
    <template>
        <ul>
            <f-repeat value="{{item in list}}">
                <li>{{item}}</li>
            </f-repeat>
        </ul>
    </template>
</f-template>
<f-template name="test-element-interval-updates">
    <template>
        <ul>
            <f-repeat value="{{item in someData.list1}}">
                <li>
                    <svg width="20px" height="20px">
                        <title>Item icon</title>
                        <use href="sprites.svg#{{item.icon}}-icon"></use>
                    </svg>
                </li>
            </f-repeat>

            <f-repeat value="{{item in someData.list2}}">
                <li>
                    <svg width="20px" height="20px">
                        <title>Item icon</title>
                        <use href="sprites.svg#{{item.icon}}-icon"></use>
                    </svg>
                </li>
            </f-repeat>
        </ul>
    </template>
</f-template>
<f-template name="test-element-nested-repeat">
    <template>
        <ul>
            <f-repeat value="{{group in groups}}">
                <li data-group="{{group.name}}">
                    <f-repeat value="{{item in group.items}}">
                        <span data-item="{{item.label}}">
                            <f-repeat value="{{value in item.values}}">
                                <b>{{value}}</b>
                            </f-repeat>
                        </span>
                    </f-repeat>
                </li>
            </f-repeat>
            <f-repeat value="{{item in tail}}">
                <li data-tail>{{item}}</li>
            </f-repeat>
        </ul>
    </template>
</f-template>
