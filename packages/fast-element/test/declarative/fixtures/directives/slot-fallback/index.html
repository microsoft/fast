<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="utf-8">
        <title>Conditional slot fallback</title>
    </head>
    <body>
        <test-conditional-slot id="slot-hidden"><template shadowrootmode="open" shadowroot="open"><test-slot-fallback><template shadowrootmode="open" shadowroot="open"><slot><span class="fallback">Fallback</span></slot></template><!--fe:b--><!--fe:/b--></test-slot-fallback></template></test-conditional-slot>
        <test-conditional-slot id="slot-shown" show><template shadowrootmode="open" shadowroot="open"><test-slot-fallback><template shadowrootmode="open" shadowroot="open"><slot><span class="fallback">Fallback</span></slot></template><!--fe:b--><span>Provided</span><!--fe:/b--></test-slot-fallback></template></test-conditional-slot>
<f-template name="test-slot-fallback">
    <template><slot><span class="fallback">Fallback</span></slot></template>
</f-template>
<f-template name="test-conditional-slot">
    <template><test-slot-fallback><f-when value="{{show}}"><span>Provided</span></f-when></test-slot-fallback></template>
</f-template>

        <script type="module" src="./main.ts"></script>
    </body>
</html>
