<f-template name="test-slot-fallback">
    <template><slot><span class="fallback">Fallback</span></slot></template>
</f-template>
<f-template name="test-conditional-slot">
    <template><test-slot-fallback><f-when value="{{show}}"><span>Provided</span></f-when></test-slot-fallback></template>
</f-template>
