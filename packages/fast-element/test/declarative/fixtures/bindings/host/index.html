<!DOCTYPE html>
<!-- biome-ignore-all format: SSR-rendered output binding markers must survive byte-for-byte -->
<html lang="en-US">
    <head>
        <meta charset="utf-8">
        <title>Host Bindings Test</title>
        <style>
        /* Ensure custom elements display as block to prevent overlap */
host-event-element,
host-multi-element,
host-static-element,
host-events-element,
host-multi-content-element,
host-text-binding-element,
host-property-element,
host-all-types-element,
host-perm-attr-first,
host-perm-bool-first,
host-perm-prop-first,
host-autofocus {
    display: block;
    margin: 10px 0;
    padding: 10px;
    border: 1px solid #ccc;
}
        </style>
    </head>
    <body>
        <host-event-element role="button" appearance="value"><template shadowrootmode="open" shadowroot="open"><span><!--fe:b-->Hello<!--fe:/b--></span></template></host-event-element>
        <host-multi-element disabled><template shadowrootmode="open" shadowroot="open"><span><!--fe:b-->World<!--fe:/b--></span></template></host-multi-element>
        <host-static-element id="static-host"><template shadowrootmode="open" shadowroot="open"><span><!--fe:b-->first<!--fe:/b--> <!--fe:b-->second<!--fe:/b--></span></template></host-static-element>
        <host-events-element text="content text"><template shadowrootmode="open" shadowroot="open"><!--fe:b-->content text<!--fe:/b--></template></host-events-element>
        <host-multi-content-element first="a" second="b"><template shadowrootmode="open" shadowroot="open"><span first="a" second="b" data-fe="2"></span></template></host-multi-content-element>
        <host-text-binding-element text="text content"><template shadowrootmode="open" shadowroot="open"><span><!--fe:b-->text content<!--fe:/b--></span></template></host-text-binding-element>
        <host-property-element text="property test"><template shadowrootmode="open" shadowroot="open"><span><!--fe:b-->property test<!--fe:/b--></span></template></host-property-element>
        <host-all-types-element text="all types" attr="value" disabled><template shadowrootmode="open" shadowroot="open"><span><!--fe:b-->all types<!--fe:/b--></span></template></host-all-types-element>
        <host-perm-attr-first text="perm attr first" attr="value" disabled><template shadowrootmode="open" shadowroot="open"><span><!--fe:b-->perm attr first<!--fe:/b--></span></template></host-perm-attr-first>
        <host-perm-bool-first text="perm bool first" attr="value" disabled><template shadowrootmode="open" shadowroot="open"><span><!--fe:b-->perm bool first<!--fe:/b--></span></template></host-perm-bool-first>
        <host-perm-prop-first text="perm prop first" attr="value" disabled><template shadowrootmode="open" shadowroot="open"><span><!--fe:b-->perm prop first<!--fe:/b--></span></template></host-perm-prop-first>
        <!-- biome-ignore lint/a11y/noAutofocus: deliberate fixture verifying author-provided host attribute propagation through SSR -->
        <host-autofocus autofocus tabindex="0"><template shadowrootmode="open" shadowroot="open"><span><!--fe:b-->World<!--fe:/b--></span></template></host-autofocus>
<!-- biome-ignore-all format: SSR renderer requires multi-line <template> layout for binding marker placement -->
<f-template hidden name="host-event-element" data-definition="not-a-host-attribute">
    <f-host role="button" appearance="{{hostAttr}}" @click="{handleClick()}"></f-host>
    <template data-legacy="not-a-host-attribute">
        <span>{{greeting}}</span>
    </template>
</f-template>
<f-template hidden name="host-multi-element">
    <f-host @click="{handleClick()}" ?disabled="{{isDisabled}}"></f-host>
    <template>
        <span>{{text}}</span>
    </template>
</f-template>
<f-template hidden name="host-static-element">
    <f-host id="static-host" @click="{handleClick()}"></f-host>
    <template>
        <span>{{first}} {{second}}</span>
    </template>
</f-template>
<f-template hidden name="host-events-element">
    <f-host @click="{handleClick()}" @mouseenter="{handleMouseEnter()}"></f-host>
    <template>
        {{text}}
    </template>
</f-template>
<f-template hidden name="host-multi-content-element">
    <f-host @click="{handleClick()}"></f-host>
    <template>
        <span first="{{first}}" second="{{second}}"></span>
    </template>
</f-template>
<f-template hidden name="host-text-binding-element">
    <f-host @click="{handleClick()}"></f-host>
    <template>
        <span>{{text}}</span>
    </template>
</f-template>
<f-template hidden name="host-property-element">
    <f-host :title="{hostTitle}"></f-host>
    <template>
        <span>{{text}}</span>
    </template>
</f-template>
<f-template hidden name="host-all-types-element">
    <f-host @click="{handleClick()}" ?disabled="{{isDisabled}}" :title="{hostTitle}" attr="{{hostAttr}}"></f-host>
    <template>
        <span>{{text}}</span>
    </template>
</f-template>
<f-template hidden name="host-perm-attr-first">
    <f-host attr="{{hostAttr}}" :title="{hostTitle}" ?disabled="{{isDisabled}}" @click="{handleClick()}"></f-host>
    <template>
        <span>{{text}}</span>
    </template>
</f-template>
<f-template hidden name="host-perm-bool-first">
    <f-host ?disabled="{{isDisabled}}" @click="{handleClick()}" attr="{{hostAttr}}" :title="{hostTitle}"></f-host>
    <template>
        <span>{{text}}</span>
    </template>
</f-template>
<f-template hidden name="host-perm-prop-first">
    <f-host :title="{hostTitle}" attr="{{hostAttr}}" @click="{handleClick()}" ?disabled="{{isDisabled}}"></f-host>
    <template>
        <span>{{text}}</span>
    </template>
</f-template>
<f-template hidden name="host-autofocus">
    <f-host tabindex="0"></f-host>
    <template>
        <span>{{text}}</span>
    </template>
</f-template>

        <script type="module" src="./main.ts"></script>
    </body>
</html>
