<!-- biome-ignore-all format: SSR renderer requires multi-line <template> layout for binding marker placement -->
<f-template hidden name="host-event-element" data-definition="not-a-host-attribute">
    <f-host role="button" appearance="{{hostAttr}}" @click="{handleClick()}"></f-host>
    <template data-legacy="not-a-host-attribute">
        <span>{{greeting}}</span>
    </template>
</f-template>
<f-template hidden name="host-multi-element">
    <f-host @click="{handleClick()}" ?disabled="{{isDisabled}}"></f-host>
    <template>
        <span>{{text}}</span>
    </template>
</f-template>
<f-template hidden name="host-static-element">
    <f-host id="static-host" @click="{handleClick()}"></f-host>
    <template>
        <span>{{first}} {{second}}</span>
    </template>
</f-template>
<f-template hidden name="host-events-element">
    <f-host @click="{handleClick()}" @mouseenter="{handleMouseEnter()}"></f-host>
    <template>
        {{text}}
    </template>
</f-template>
<f-template hidden name="host-multi-content-element">
    <f-host @click="{handleClick()}"></f-host>
    <template>
        <span first="{{first}}" second="{{second}}"></span>
    </template>
</f-template>
<f-template hidden name="host-text-binding-element">
    <f-host @click="{handleClick()}"></f-host>
    <template>
        <span>{{text}}</span>
    </template>
</f-template>
<f-template hidden name="host-property-element">
    <f-host :title="{hostTitle}"></f-host>
    <template>
        <span>{{text}}</span>
    </template>
</f-template>
<f-template hidden name="host-all-types-element">
    <f-host @click="{handleClick()}" ?disabled="{{isDisabled}}" :title="{hostTitle}" attr="{{hostAttr}}"></f-host>
    <template>
        <span>{{text}}</span>
    </template>
</f-template>
<f-template hidden name="host-perm-attr-first">
    <f-host attr="{{hostAttr}}" :title="{hostTitle}" ?disabled="{{isDisabled}}" @click="{handleClick()}"></f-host>
    <template>
        <span>{{text}}</span>
    </template>
</f-template>
<f-template hidden name="host-perm-bool-first">
    <f-host ?disabled="{{isDisabled}}" @click="{handleClick()}" attr="{{hostAttr}}" :title="{hostTitle}"></f-host>
    <template>
        <span>{{text}}</span>
    </template>
</f-template>
<f-template hidden name="host-perm-prop-first">
    <f-host :title="{hostTitle}" attr="{{hostAttr}}" @click="{handleClick()}" ?disabled="{{isDisabled}}"></f-host>
    <template>
        <span>{{text}}</span>
    </template>
</f-template>
<f-template hidden name="host-autofocus">
    <f-host tabindex="0"></f-host>
    <template>
        <span>{{text}}</span>
    </template>
</f-template>
