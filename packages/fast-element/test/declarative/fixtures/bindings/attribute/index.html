<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="utf-8">
        <title></title>
    </head>
    <body>
        <test-element type="checkbox"><template shadowrootmode="open" shadowroot="open"><input type="checkbox" disabled data-fe="1"></template></test-element>
        <test-element-property><template shadowrootmode="open" shadowroot="open"><input type="checkbox" disabled data-fe="1"></template></test-element-property>
        <test-element-expression><template shadowrootmode="open" shadowroot="open"><input disabled type="button" data-fe="1"></template></test-element-expression>
        <test-element-nullable><template shadowrootmode="open" shadowroot="open"><a id="nullable-link" data-fe="3">Link</a>
        <a id="empty-link" href="" data-fe="1">Empty link</a>
        <input id="nullable-input" data-fe="2"></template></test-element-nullable>
<f-template name="test-element">
    <template> <input type="{{type}}" disabled> </template>
</f-template>
<!-- biome-ignore-start lint/a11y/useValidAriaRole: This template intentionally binds the role at runtime. -->
<f-template name="test-element-nullable">
    <template>
        <a id="nullable-link" href="{{nullableHref}}" role="{{missingRole}}" tabindex="{{nullableTabIndex}}">Link</a>
        <a id="empty-link" href="{{emptyHref}}">Empty link</a>
        <input id="nullable-input" ?disabled="{{isDisabled}}" value="{{nullableValue}}">
    </template>
</f-template>
<!-- biome-ignore-end lint/a11y/useValidAriaRole: This template intentionally binds the role at runtime. -->
<f-template name="test-element-property">
    <template> <input type="checkbox" ?disabled="{{!isEnabled}}"> </template>
</f-template>
<f-template name="test-element-expression">
    <template>
        <input ?disabled="{{activeGroup == currentGroup}}" type="button">
    </template>
</f-template>

        <script type="module" src="./main.ts"></script>
    </body>
</html>
