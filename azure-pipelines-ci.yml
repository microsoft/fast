pr:
  branches:
    include:
    - main
  drafts: false

# CI validates untrusted (including fork) PRs, so unlike the CD/release pipeline it does not
# extend the 1ES PT. 1ES PT compliance/SDL overhead (and the private CFS feed authentication
# that comes with it) is only required for production/release pipelines.
resources:
  repositories:
  - repository: fastPipelines
    type: git
    name: open-source/FASTPipelineTemplates
    ref: main

pool:
  vmImage: "ubuntu-latest"

variables:
  npm_config_cache: $(Pipeline.Workspace)/.npm
  # Temporary: unblocks Drift Management enforcement while the pipeline's non-production
  # classification sync propagates. Remove once drift checks confirm the classification.
  ONEES_DRIFTBREAKGLASS: Reclassified as non-production in Product Catalog; pending Drift Management sync

steps:
  - checkout: self

  - task: UseNode@1
    inputs:
      version: "22.x"
    displayName: "Install Node.js"

  - task: Cache@2
    inputs:
      key: 'npm | "$(Agent.OS)" | package-lock.json'
      restoreKeys: |
        npm | "$(Agent.OS)"
      path: $(npm_config_cache)
    displayName: "Cache npm"

  - template: FAST.CFS.PipelineTemplate.yml@fastPipelines
    parameters:
      installRust: true
      rustVersion: "1.93"
      additionalRustTargets: wasm32-unknown-unknown

  - script: |
      npm ci
    displayName: "Install package dependencies"

  - script: |
      set -euo pipefail
      rustc --version
      cargo --version
      export PATH="$CARGO_HOME/bin:$PATH"
      echo "##vso[task.prependpath]$CARGO_HOME/bin"
      cargo install --registry openSource_PublicPackages wasm-pack
    displayName: "Install wasm-pack (private feed, trusted builds)"
    condition: and(succeeded(), ne(variables['System.PullRequest.IsFork'], 'True'))

  # Fork PR builds use the public Rust toolchain and do not have the private CFS
  # Cargo registry configured, so install wasm-pack from the default crates.io registry.
  - script: |
      set -euo pipefail
      rustc --version
      cargo --version
      cargo install wasm-pack
    displayName: "Install wasm-pack (public fallback, untrusted fork PRs)"
    condition: and(succeeded(), eq(variables['System.PullRequest.IsFork'], 'True'))

  - script: |
      npm run build
    displayName: "Build workspaces"
