pr:
  branches:
    include:
    - main
  drafts: false

# CI is classified non-production, so it does not extend the 1ES PT and does not need
# the private CFS package feed (both are scoped to production pipelines). All package
# installs use the default public registries directly.
pool:
  vmImage: "ubuntu-latest"

variables:
  npm_config_cache: $(Pipeline.Workspace)/.npm
  # Temporary: unblocks Drift Management enforcement while the pipeline's non-production
  # classification sync propagates. Remove once drift checks confirm the classification.
  ONEES_DRIFTBREAKGLASS: Reclassified as non-production in Product Catalog; pending Drift Management sync

steps:
  - checkout: self

  - task: UseNode@1
    inputs:
      version: "22.x"
    displayName: "Install Node.js"

  - task: Cache@2
    inputs:
      key: 'npm | "$(Agent.OS)" | package-lock.json'
      restoreKeys: |
        npm | "$(Agent.OS)"
      path: $(npm_config_cache)
    displayName: "Cache npm"

  - task: RustInstaller@1
    displayName: "Install Rust toolchain"
    inputs:
      rustVersion: stable
      additionalTargets: wasm32-unknown-unknown

  - script: |
      npm ci
    displayName: "Install package dependencies"

  - script: |
      set -euo pipefail
      rustc --version
      cargo --version
      cargo install wasm-pack
    displayName: "Install wasm-pack"

  - script: |
      npm run build
    displayName: "Build workspaces"
